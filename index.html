<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Theme resolution runs FIRST, synchronously, before any stylesheet or paint.
      Moving this below the font links, making it external, or adding `defer`
      reintroduces the light-mode flash this exists to prevent.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          // Light first. The owner chose paper as the opening, so the OS
          // preference does not override it; only an explicit toggle does.
          var theme = stored === 'dark' ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%236B35E8'/%3E%3Ctext x='16' y='24' font-family='Georgia,serif' font-style='italic' font-size='22' text-anchor='middle' fill='%23FAFAFA'%3EL%3C/text%3E%3C/svg%3E" />
    <title>Lalaine Jannah dela Cruz</title>
    <meta
      name="description"
      content="BS Information Technology student, web developer and graphic designer. I design it, then I build it."
    />
    <meta name="theme-color" content="#FAFAFA" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Public+Sans:wght@300..800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
